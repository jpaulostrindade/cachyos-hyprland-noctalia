# Desktop idle policy: lock and power off displays, never suspend automatically.
[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 900
# Locking re-arms idle timers; wait another 5 minutes while locked.
locked_timeout = 300

[idle.behavior.lock-and-suspend]
enabled = false
